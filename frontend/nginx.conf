# O React Router troca de página sem pedir outro arquivo pro servidor.
# Quem abre direto um endereço como /animais/123 ou recarrega a página recebe o index.html,
# e o React mostra a tela certa (o mesmo que o Netlify faz no site publicado)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos de /assets têm o código no nome e mudam de nome a cada build: podem ficar guardados no navegador
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
