<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Adota Aqui</title>
    <!-- Liga o tema escuro antes de a página aparecer, pra não piscar claro e depois escuro.
         A mesma regra está no hooks/useTema.js: vale a escolha salva e, sem escolha, o tema do sistema -->
    <script>
      try {
        var tema = localStorage.getItem("adotaaqui.tema");
        var escuro = tema === "escuro" || (!tema && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (escuro) document.documentElement.classList.add("tema-escuro");
      } catch (erro) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
