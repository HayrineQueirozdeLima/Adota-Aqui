<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Adota Aqui</title>
    <meta
      name="description"
      content="Plataforma de adoção de cães e gatos: protetores e abrigos divulgam os animais, e quem quer adotar demonstra interesse e recebe o contato."
    />
    <meta name="theme-color" content="#4a2d73" />
    <!-- A prévia que aparece quando alguém manda um link do site no WhatsApp ou nas redes.
         O site monta as páginas no navegador, então a prévia é a mesma pra todas.
         A imagem precisa do endereço completo, por isso aponta pro site publicado -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Adota Aqui" />
    <meta property="og:title" content="Adota Aqui" />
    <meta
      property="og:description"
      content="Cães e gatos esperando um lar perto de você. Conheça os animais de abrigos e protetores e demonstre interesse."
    />
    <meta property="og:image" content="https://adotaaqui.netlify.app/compartilhar.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo do Adota Aqui e a frase: cães e gatos esperando um lar perto de você"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Liga o tema escuro antes de a página aparecer, pra não piscar claro e depois escuro.
         A mesma regra está no hooks/useTema.js: vale a escolha salva e, sem escolha, o tema do sistema -->
    <script>
      try {
        var tema = localStorage.getItem("adotaaqui.tema");
        var escuro =
          tema === "escuro" ||
          (!tema && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (escuro) document.documentElement.classList.add("tema-escuro");
      } catch (erro) {}
      // Animações ao rolar (hooks/useRevelarAoRolar): só liga se o navegador sabe observar a rolagem
      // e a pessoa não pediu menos movimento. Vem aqui, antes do site desenhar, pra nada piscar
      try {
        if (
          "IntersectionObserver" in window &&
          window.matchMedia("(prefers-reduced-motion: no-preference)").matches
        )
          document.documentElement.classList.add("animar");
      } catch (erro) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
