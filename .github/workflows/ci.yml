name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Os nomes dos jobs (backend e frontend) são os que a proteção da branch exige.
# Se mudar o nome aqui, a regra do GitHub passa a esperar um check que nunca chega.
jobs:
  backend:
    # Versão fixa do Ubuntu: o "ubuntu-latest" muda pro Ubuntu 26 a partir de 19/10/2026,
    # bem na reta final do projeto. Fixar evita surpresa no CI até a entrega.
    runs-on: ubuntu-24.04
    # Se travar, cancela em 20 minutos (sem isso, o GitHub espera até 6 horas)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Guarda as bibliotecas do Maven entre as execuções: não baixa tudo de novo a cada vez
          cache: maven
      - name: Build e testes do backend
        run: mvn -B -f backend/pom.xml verify
      - name: Guarda o relatório de cobertura do backend
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Mesma ideia do Maven: guarda os pacotes do npm entre as execuções
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instala, builda e testa o frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          npm run test:coverage -- --ci
      - name: Guarda o relatório de cobertura do frontend
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov-report/
