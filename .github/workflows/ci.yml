name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build e testes do backend
        run: mvn -B -f backend/pom.xml verify
      - name: Guarda o relatório de cobertura do backend
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instala, builda e testa o frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          npm run test:coverage -- --ci
      - name: Guarda o relatório de cobertura do frontend
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov-report/