spring.application.name=adota-aqui

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/adota_aqui}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O schema é criado pelo Flyway (db/migration). O Hibernate apenas confere
# se as entidades batem com as tabelas e impede a aplicação de subir se não baterem.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET:troque-este-valor-antes-de-ir-para-producao}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
