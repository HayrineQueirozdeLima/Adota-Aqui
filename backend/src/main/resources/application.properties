spring.application.name=adota-aqui

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/adota_aqui}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Hibernate cria e atualiza as tabelas a partir das entidades (pacote model)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O Render avisa a porta pela variável PORT. Na máquina de vocês, continua 8080
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:troque-este-valor-antes-de-ir-para-producao}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Endereços que podem chamar a API pelo navegador, separados por vírgula.
# No deploy, a variável CORS_ORIGENS recebe o endereço do Netlify.
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}