spring.application.name=adota-aqui

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/adota_aqui}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Hibernate cria e atualiza as tabelas a partir das entidades (pacote model)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O Render avisa a porta pela variável PORT. Na máquina de vocês, continua 8080
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:troque-este-valor-antes-de-ir-para-producao}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Endereços que podem chamar a API pelo navegador, separados por vírgula. Aceita * (ex.: as prévias do Netlify).
# No Render: https://adotaaqui.netlify.app,https://deploy-preview-*--adotaaqui.netlify.app,http://localhost:5173
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}





# Fotos dos animais (RF16): "memoria" na máquina local e nos testes; no Render, FOTOS_ARMAZENAMENTO=s3
app.fotos.armazenamento=${FOTOS_ARMAZENAMENTO:memoria}
# Endereço público do bucket, é com ele que a URL de cada foto é montada
app.fotos.url-base=${FOTOS_URL_BASE:http://localhost:8080/fotos}
app.fotos.s3.bucket=${S3_BUCKET:}
app.fotos.s3.regiao=${AWS_REGION:us-east-2}
# Vazio = Amazon S3. Preenchido = outro serviço compatível com S3 (ex.: Cloudflare R2)
app.fotos.s3.endpoint=${S3_ENDPOINT:}
# Um pouco acima dos 5 MB, pra mensagem de limite vir do FotoService
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB