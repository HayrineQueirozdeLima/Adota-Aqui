spring.datasource.url=jdbc:h2:mem:adota_aqui_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Nos testes o schema é gerado a partir das entidades, sem o Flyway,
# porque o script de migração é específico do PostgreSQL.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=segredo-apenas-para-testes-com-tamanho-suficiente-para-hmac
jwt.expiration-ms=3600000
