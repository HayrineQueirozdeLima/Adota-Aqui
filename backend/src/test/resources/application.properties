spring.datasource.url=jdbc:h2:mem:adota_aqui_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=segredo-apenas-para-testes-com-tamanho-suficiente-para-hmac
jwt.expiration-ms=3600000



# Fotos dos animais (RF16): "memoria" na máquina local e nos testes; no Render, FOTOS_ARMAZENAMENTO=s3
app.fotos.armazenamento=${FOTOS_ARMAZENAMENTO:memoria}
# Endereço público do bucket, é com ele que a URL de cada foto é montada
app.fotos.url-base=${FOTOS_URL_BASE:http://localhost:8080/fotos}
app.fotos.s3.bucket=${S3_BUCKET:}
app.fotos.s3.regiao=${AWS_REGION:us-east-2}
# Vazio = Amazon S3. Preenchido = outro serviço compatível com S3 (ex.: Cloudflare R2)
app.fotos.s3.endpoint=${S3_ENDPOINT:}
# Um pouco acima dos 5 MB, pra mensagem de limite vir do FotoService
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB